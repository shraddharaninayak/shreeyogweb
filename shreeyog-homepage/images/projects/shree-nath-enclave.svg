<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B15"/>
      <stop offset="100%" stop-color="#140F0C"/>
    </linearGradient>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(181, 158, 125, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#archGrid)"/>

  <!-- Architectural Framework Line Art -->
  <rect x="70" y="70" width="660" height="460" fill="none" stroke="rgba(181, 158, 125, 0.25)" stroke-width="1.2"/>
  <rect x="85" y="85" width="630" height="430" fill="none" stroke="rgba(181, 158, 125, 0.12)" stroke-width="0.8"/>

  <!-- Blueprint Building Elevation Motif -->
  <g transform="translate(400, 240)" stroke="rgba(181, 158, 125, 0.4)" fill="none" stroke-width="1.2">
    <!-- Central Tower -->
    <rect x="-60" y="-80" width="120" height="150" />
    <line x1="-60" y1="-50" x2="60" y2="-50" stroke-dasharray="3,3" />
    <line x1="-60" y1="-20" x2="60" y2="-20" stroke-dasharray="3,3" />
    <line x1="-60" y1="10" x2="60" y2="10" stroke-dasharray="3,3" />
    <line x1="-60" y1="40" x2="60" y2="40" stroke-dasharray="3,3" />
    <!-- Vertical Division -->
    <line x1="0" y1="-80" x2="0" y2="70" stroke="rgba(181, 158, 125, 0.25)" />
    <!-- Left Wing -->
    <rect x="-110" y="-40" width="50" height="110" />
    <line x1="-110" y1="-10" x2="-60" y2="-10" stroke-dasharray="3,3" />
    <line x1="-110" y1="20" x2="-60" y2="20" stroke-dasharray="3,3" />
    <!-- Right Wing -->
    <rect x="60" y="-40" width="50" height="110" />
    <line x1="60" y1="-10" x2="110" y2="-10" stroke-dasharray="3,3" />
    <line x1="60" y1="20" x2="110" y2="20" stroke-dasharray="3,3" />
    <!-- Pediment Apex -->
    <polyline points="-60,-80 0,-105 60,-80" stroke="var(--color-tobacco, #B59E7D)" stroke-width="1.5" />
    <circle cx="0" cy="-92" r="3" fill="#B59E7D" />
  </g>

  <!-- Typography -->
  <text x="400" y="375" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="400" fill="#F1EADA" letter-spacing="1">ShreeNath Enclave</text>
  <text x="400" y="415" text-anchor="middle" font-family="'Jost', sans-serif" font-size="11" font-weight="500" fill="#B59E7D" letter-spacing="4">COMPLETED RESIDENTIAL LANDMARK</text>
  <text x="400" y="445" text-anchor="middle" font-family="'Jost', sans-serif" font-size="10" font-weight="300" fill="rgba(241, 234, 218, 0.65)" letter-spacing="2">SHREEYOG BUILDERS &amp; LAND DEVELOPERS · NASHIK</text>
</svg>